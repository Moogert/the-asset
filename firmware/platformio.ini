[platformio]
default_envs = mega_engine, teensy_gateway

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra -I include

[env:mega_engine]
platform = atmelavr@5.1.0
platform_packages =
    platformio/framework-arduino-avr@5.2.0
    platformio/toolchain-atmelavr@1.70300.191015
board = megaatmega2560
build_src_filter = +<mega_engine.cpp>

[env:teensy_gateway]
platform = teensy@5.0.0
platform_packages =
    platformio/framework-arduinoteensy@1.159.0
    platformio/toolchain-gccarmnoneeabi-teensy@1.110301.0
    platformio/tool-teensy@1.162.0
board = teensy41
build_src_filter = +<teensy_gateway.cpp>

; Isolated historical demonstration only: never connect to vehicle OBD/MIL.
[env:teensy_legacy_obd_demo]
extends = env:teensy_gateway
build_flags = ${env.build_flags} -DCAPSTONE_LEGACY_OBD_DEMO=1
build_src_filter = +<legacy_obd_gateway.cpp>
